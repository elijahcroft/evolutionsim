# An Earth-like reference planet. Every value here is meant to be varied: the point of the
# project is that changing these produces different biospheres, not different cosmetics.
#
# Values marked "enters the energy equations" are read directly by src/evosim/life/energy.py.
# They are not modifiers or bonuses; they are terms in a cost or intake formula.

name: Terra

# ---- grid ------------------------------------------------------------------------------
# Equirectangular, wrapping east-west, not wrapping north-south (poles are edges).
grid_width: 128
grid_height: 64

# ---- global physical scalars -----------------------------------------------------------
gravity: 1.0            # in g. Enters body-support and locomotion cost.
o2_fraction: 0.21       # by volume. Caps aerobic scope => caps size x metabolic_rate product.
o2_reference: 0.21      # the fraction at which aerobic scope is 1.0; do not vary casually.
pressure: 1.0           # atm at the surface. Enters pressure-tolerance mismatch hazard and drag.
# Added to surface pressure per km of water above an organism. At the default 6 km sea floor
# this makes the deepest water differ from the surface by 0.9, which is the difference the
# mismatch hazard is scaled for -- so the deep is survivable, but only for a lineage that has
# actually evolved pressure_tolerance. With this at 0 the locus is dead: on a 1 atm planet the
# mismatch term is identically zero everywhere, which is what it was until now.
pressure_per_km_depth: 0.15
solar_constant: 1.0     # relative to Earth. Scales insolation, hence autotrophic intake.
radiation: 0.0          # relative surface ionising flux. Raises mutation rate AND mortality.

# ---- orbit and rotation ----------------------------------------------------------------
axial_tilt: 23.4        # degrees. 0 => no seasons. High tilt => violent continental seasons.
day_length_hours: 24.0  # modulates daylight fraction, hence daily insolation total.
year_length_days: 365   # ticks per orbit. Short years => fast seasonal cycling.

# ---- terrain generation ----------------------------------------------------------------
terrain:
  sea_level: 0.0        # elevation threshold; cells below this are water.
  octaves: 6            # layered value-noise detail levels.
  base_frequency: 2.5   # features per world width at octave 0. Low => few large continents.
  persistence: 0.55     # amplitude falloff per octave.
  lacunarity: 2.0       # frequency gain per octave.
  # Elevation is renormalised so this fraction of cells ends up above sea level. Makes
  # "ocean coverage" a direct dial instead of an emergent surprise of the noise function.
  land_fraction: 0.29
  max_elevation_km: 6.0 # scales normalised elevation to km, for the temperature lapse rate.

# ---- climate ---------------------------------------------------------------------------
climate:
  base_temperature_c: -18.0   # temperature at zero insolation (radiative floor).
  insolation_amplitude_c: 48.0  # degrees added at full insolation.
  lapse_rate_c_per_km: 6.5      # elevation cooling.
  # Thermal inertia: fraction of the way a cell moves toward its instantaneous equilibrium
  # each tick. Water is far more sluggish than land, which is what creates maritime vs
  # continental climates -- and therefore extreme-seasonality niches -- for free.
  inertia_land: 0.25
  inertia_water: 0.02
  # Moisture: oceans are saturated; land moisture falls off with distance from water and rises
  # with temperature-driven evaporation. Crude, but enough to make continental interiors dry.
  moisture_ocean: 1.0
  moisture_decay_per_cell: 0.12
  moisture_min: 0.02
  # Light reaching the sea floor: insolation * exp(-attenuation * depth_km). Organisms live at
  # the floor, so this decides how much of the ocean can photosynthesise at all.
  #
  # Earth's photic zone ends near 0.2 km, an attenuation around 23. On a 6 km floor that leaves
  # a shelf of a couple of percent of cells and starves everything else, and it is the wrong
  # number here anyway: real marine primary production happens in the surface layer, which a
  # single-layer world does not have. 0.75 was chosen by measurement, not by physics -- it is
  # the largest value that leaves the reference planet's marine population healthy while still
  # emptying the abyss. Life settles across 0-2 km and stops; see DEVLOG for the depth profile.
  light_attenuation_per_km: 0.75
  # The thermocline. Water temperature falls from its surface equilibrium toward
  # deep_temperature_c, asymptotically, over thermocline_scale_km -- Earth's deep ocean is
  # near 4 C everywhere regardless of the latitude above it, and does not keep cooling with
  # depth once it gets there. Added in M7b because a light gradient alone gave the deep no
  # character of its own: it was dark, and otherwise identical to the shelf. Cold buys two
  # things -- detritus decays more slowly where it lands (the Q10 term in resources), and a
  # deep lineage has a genuinely different thermal optimum to adapt toward.
  deep_temperature_c: 4.0
  thermocline_scale_km: 1.0

# ---- resources -------------------------------------------------------------------------
resources:
  nutrient_capacity_land: 1.0
  nutrient_capacity_water: 0.6
  nutrient_regen_land: 0.02      # per tick, logistic toward capacity, scaled by moisture.
  nutrient_regen_water: 0.05     # oceans regenerate faster but hold less.
  upwelling_bonus: 0.5           # extra regen near steep bathymetry.
  # Detritus is the corpse/waste pool. It decays into nutrients at a temperature-dependent
  # rate, standing in for decomposers until real ones evolve to compete with it.
  detritus_decay_rate: 0.01
  detritus_decay_q10: 2.0        # decay rate doubles per +10 C.
  detritus_reference_temp_c: 15.0
  # Marine snow. Each tick a water cell sends this fraction of its detritus to its deepest
  # water neighbour. Without it the dark ocean is not a niche but a dead zone: no light means
  # no autotrophs, no autotrophs means no corpses, and a detritivore starves there as surely
  # as a photosynthesiser does. This is the term that connects the lit shelf that produces
  # food to the dark floor that can only inherit it, and it conserves matter exactly.
  detritus_sink_fraction: 0.10

# ---- toxicity --------------------------------------------------------------------------
# A static hostile-chemistry field. Uniform by default; raise it to make the planet hostile.
base_toxicity: 0.0
toxicity_elevation_coupling: 0.0   # >0 concentrates toxicity in highlands (volcanic proxy).
