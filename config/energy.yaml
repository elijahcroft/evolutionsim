# Every coefficient in the energy, mortality, and reproduction equations.
#
# This file is where the simulation is tuned. The rule the project follows: a trait may only
# be advantageous by earning energy, and may only be costly by spending energy or raising a
# mortality hazard. There are no direct stat bonuses anywhere, so this file plus genome.yaml
# fully determines what selection favours.
#
# Formulas are documented at the point of use in src/evosim/life/. Symbols below:
#   m = body mass = volume * body_density    g = planet gravity    T = local temperature
#
# Body volume, surface area, frontal area, limb count and slenderness are integrated from the
# morphology genome in src/evosim/life/phenotype.py. See config/genome.yaml for what the shape
# genes mean. Nothing here knows what an animal looks like; it only knows these five numbers.

energy_density: 1.0        # energy per unit mass, for predation gain and corpse deposition.

# ---- costs, per tick --------------------------------------------------------------------
costs:
  # basal = k_basal * m^0.75 * metabolic_rate * aerobic_scope * Q10(T) * upkeep_multipliers
  # The 0.75 exponent is Kleiber's law: metabolism scales sublinearly with mass, which is what
  # makes being large energetically efficient per unit mass and creates a real size incentive
  # to trade against the support and locomotion costs below.
  k_basal: 0.010
  basal_mass_exponent: 0.75
  basal_q10: 2.0                    # basal cost doubles per +10 C of body temperature.
  basal_reference_temp_c: 15.0

  # Upkeep of expensive tissue, added as multipliers on basal cost. These are what make
  # generalism, good digestion, longevity, and repair genuinely expensive.
  upkeep_temp_tolerance: 0.020      # per degree of tolerance half-width.
  upkeep_digestion: 0.900           # per unit of digestion_efficiency.
  upkeep_radiation_tolerance: 0.150
  upkeep_longevity: 0.300           # per unit of (1 - senescence_rate); anti-ageing costs.

  # support = k_support * m * g * (1 + armor) / slenderness
  #           * (1 + support_segment_cost * (segment_count - 1) + support_taper_cost * |taper|)
  # Linear in mass and in gravity: holding yourself up on a heavy planet is the dominant
  # penalty on large bodies, which is how "high gravity favours small" emerges rather than
  # being asserted. `slenderness` is now derived from the body's own proportions rather than
  # asserted by a locus -- it is 1/(2*radius_ratio).
  #
  # The morphology term is the skeleton bill: a segmented body needs a repeated support
  # structure, and an unbalanced one (bulk pushed fore or aft by `taper`) needs more of it than
  # a body whose mass sits over its middle. Both are zero for the founder, which has one
  # segment and no taper, so they change nothing until a lineage evolves into them.
  k_support: 0.006
  support_segment_cost: 0.030       # per segment beyond the first.
  support_taper_cost: 0.120         # per unit of |taper|.

  # locomotion = k_move * m * move_speed^2 * g^0.5 * medium_drag
  #              * (cross_section / volume^(2/3) / drag_shape_reference)
  #              * (1 + limb_drag_cost * limb_count * limb_ratio)
  # Quadratic in speed (drag work), so speed is the single most expensive trait to push.
  #
  # Body shape entered the equation in M8, and note carefully what the third line is: frontal
  # area divided by volume^(2/3), which is *bluntness*, not area. The equation is already
  # proportional to mass, and area and mass both grow with size, so charging raw frontal area
  # would bill a large animal twice for being large -- a body six times the founder's length
  # would pay fifty times over to move, which is a units mistake wearing a biology costume.
  # Dividing out volume^(2/3) leaves pure shape: a long thin animal and a fat one of the same
  # volume now pay differently, which is what makes streamlining something selection can find,
  # while size goes on being paid for exactly once.
  #
  # drag_shape_reference is the founder's own bluntness (0.7853982 / 0.4348114^(2/3)), so the
  # whole factor is exactly 1 for any founder-shaped body at any size. This is a re-expression
  # of the pre-M8 equation, not a re-tuning of it.
  k_move: 0.004
  move_gravity_exponent: 0.5
  drag_water: 1.6                   # denser medium: costlier to move through...
  drag_land: 1.0
  drag_shape_reference: 1.3684301
  # Limbs stick out into the flow and cost drag in every medium...
  limb_drag_cost: 0.250
  # ...but they push against a substrate, so they raise the speed ceiling on land only:
  #   max_move_speed is multiplied by (1 + limb_thrust * limb_count * limb_ratio * limb_splay)
  # Splay is in there because a limb held under the body pushes against the ground while one
  # held out to the side is a paddle. In water the factor is absent entirely: there is nothing
  # to push against, so limbs there are pure drag. That asymmetry is the whole reason limbs are
  # a real evolutionary decision rather than a free upgrade.
  limb_thrust: 0.400
  # ...but a dense atmosphere also supports the body, reducing effective support cost.
  # support is divided by (1 + pressure_buoyancy * pressure) on land.
  pressure_buoyancy: 0.05

  # sensory = k_sense * sense_range^1.5 * m^0.25
  # Superlinear in range: doubling detection radius more than doubles the neural investment.
  k_sense: 0.004
  sense_range_exponent: 1.5
  sense_mass_exponent: 0.25

  # thermoregulation = k_thermo * (surface_area / thermo_area_reference)
  #                    * max(0, |T - temp_optimum| - temp_tolerance)
  # Heat is lost across a surface, and as of M8 that surface is the real integrated area of the
  # animal's body rather than m^0.67 standing in for one. Bergmann's rule still emerges -- a
  # bigger body has less surface per unit volume -- but so does the rest of it: a flattened or
  # finned animal now genuinely pays to keep warm, and a compact one genuinely does not.
  #
  # thermo_area_reference is the founder's surface area divided by the founder's old m^0.6667
  # (2.8747542 / 0.1599853), so a founder-shaped animal pays exactly what it paid before M8 and
  # k_thermo did not have to be re-tuned when the geometry arrived.
  k_thermo: 0.0030
  thermo_area_reference: 17.9688538

  # armor_upkeep = k_armor * armor * (surface_area / thermo_area_reference)
  # Armor is plating over a surface, so it shares the surface term with thermoregulation -- as
  # the pre-M8 version of this comment said it should, back when the shared quantity was an
  # exponent rather than an area. If a future model needs them to differ, armor gets its own
  # reference key; it must not become a literal in the code.
  k_armor: 0.0015

# ---- intake, per tick -------------------------------------------------------------------
intake:
  # autotrophy = k_photo * diet_autotroph * m^0.67 * light * sat(nutrients) * sat(moisture)
  #              * digestion_efficiency
  # Surface-area scaling: light and nutrients are collected across a surface, while basal cost
  # scales as m^0.75. Autotrophs therefore have a natural size ceiling -- though at the value
  # below the binding constraint on size is body support (linear in mass), which bites first.
  #
  # Calibrated in M3, the first milestone able to measure it. The M0 guess of 0.030 was an
  # order of magnitude too low: the four factors that erode it (light ~0.83, nutrient
  # saturation ~0.67, moisture saturation ~0.87, digestion 0.40) multiply out to ~0.19, so no
  # founder cell on the reference planet returned its own upkeep and the lineage always died.
  # At 0.30 about 90% of seeded ocean cells are net-positive for the founder genome and the
  # polar 10% are not, which is the intended shape: a habitable planet with unlivable edges.
  #
  # Raised to 0.45 in M7, when depth-attenuated light removed roughly a third of the ocean's
  # usable energy and 0.30 no longer returned the founder lineage's upkeep -- day-one net
  # energy on the reference planet went to -0.23. This restores it to +1.77, close to the
  # +1.60 the planet had before the water column started absorbing anything. The constant did
  # not change because the organisms changed; it changed because the planet got darker.
  k_photo: 0.450
  photo_mass_exponent: 0.6667
  nutrient_half_saturation: 0.25     # Michaelis-Menten half-saturation constant.
  moisture_half_saturation: 0.15
  # Autotrophic uptake removes this much nutrient stock per unit energy gained.
  nutrient_draw_per_energy: 1.0

  # detritivory = k_detritus * diet_detritus * m^0.67 * sat(detritus) * digestion_efficiency
  #
  # Calibrated in M7b, the first milestone to ask whether a detritivore could live at all. The
  # M0 guess of 0.060 made it structurally impossible: intake is capped at k_detritus (the
  # saturation term cannot exceed 1), so a pure detritivore's best case was 0.0038 against
  # costs of 0.0046. It was net-negative at *every* detritus level, on every planet, forever --
  # which meant no environment could ever make detritivory pay and the deep ocean could not
  # have become a niche however dark it was. That was the real reason nothing ever specialised.
  #
  # 0.30 is chosen so the two strategies each win their own zone rather than one dominating:
  # on a lit shelf an autotroph nets +0.0130 against a detritivore's +0.0069, so detritivory is
  # a viable but clearly worse living where there is sun; in the dark deep the autotroph is
  # firmly negative and the detritivore is positive once detritus reaches ~0.3. Raising it to
  # 0.45 makes detritivory as good as autotrophy on the shelf too, which erases the zonation
  # instead of creating it.
  k_detritus: 0.300
  detritus_mass_exponent: 0.6667
  detritus_half_saturation: 0.20

  # Predation / herbivory. Encounter rate per attacker per tick:
  #   rate = k_encounter * (0.5 + aggression) * (0.3 + move_speed) * (0.3 + sense_range)^2
  #          * prey_density
  k_encounter: 0.020
  # Capture probability is a logistic on the weighted contest below. Coefficients are the
  # relative importance of each factor; they are the arms-race dials.
  capture_bias: -1.20               # baseline difficulty: most attacks fail.
  capture_size_advantage: 1.10      # per log2 ratio of attacker to prey mass.
  capture_speed_advantage: 0.80
  capture_camouflage: 1.00          # prey camouflage, divided by (1 + attacker sense_range).
  capture_armor: 0.90
  capture_aggression: 0.35
  # A specialist gets little from the wrong food. diet_match is the dot product of the
  # attacker's herbivore/carnivore affinities with the prey's autotroph/heterotroph character.
  diet_match_floor: 0.05

  # Aerobic scope: intake and activity are capped at this multiple of basal cost, scaled by
  # oxygen availability. This is the mechanism by which a low-O2 planet limits body size and
  # activity level without any rule that says so.
  aerobic_scope_max: 8.0
  aerobic_scope_o2_exponent: 0.75

# ---- mortality hazards, per tick --------------------------------------------------------
# Each is an independent probability; they combine as 1 - prod(1 - h_i).
mortality:
  background: 0.0002
  # thermal = h_thermal_max * sigmoid over the tolerance-exceeded amount, so a brief excursion
  # is survivable and a sustained one is not.
  h_thermal_max: 0.30
  thermal_lethal_margin_c: 15.0     # degrees beyond tolerance at which hazard is ~half of max.
  h_radiation_max: 0.30
  radiation_scale: 1.0              # divided by (1 + radiation_tolerance).
  h_toxicity_max: 0.40
  toxicity_scale: 1.0
  h_pressure_max: 0.25
  pressure_mismatch_scale: 1.0      # |pressure - 1| / (1 + pressure_tolerance).
  # senescence = senescence_rate * (age / maturity_age)^exponent, clipped to 1.
  senescence_exponent: 3.0
  # Starvation is not probabilistic: energy <= 0 is death.

# ---- reproduction ----------------------------------------------------------------------
reproduction:
  # Cost per offspring = parental_investment * offspring_storage_capacity, and that energy
  # becomes the offspring's starting energy. Nothing is created or destroyed, so the r/K
  # tradeoff is enforced by arithmetic rather than by a rule.
  overhead: 1.15                    # >1: reproduction is lossy (gametes, failed births).
  # Offspring are placed in the parent's cell, displaced by up to this many cells.
  dispersal_radius: 1.0
  # Sexual reproduction: a mate must be in the same cell with standardised genetic distance
  # below this threshold. This is what makes assortative mating reinforce speciation.
  mate_search_radius: 0.0           # cells; 0 = same cell only.
  #
  # This one constant does two jobs -- it decides who may breed with whom, and (because the
  # split test reuses it rather than inventing a second number) what counts as a species.
  #
  # 0.15 was an M0 guess and M6 could not improve on it, for a decisive reason: measured over
  # two *completely isolated* lineages, the gap between them fell below the 99th percentile of
  # ordinary within-population distance. There was no value that separated real lineages
  # without also cutting an undivided population into pieces, so the number did not matter.
  #
  # M7b reopened that window. With a thermocline and a detritivory constant that permits a
  # second living, isolated lineages now sit at 0.0619 apart against a within-population p99 of
  # 0.0459 -- signal above noise, with room between them. 0.05 sits in that room. It is the
  # first value here chosen against a measurement instead of a guess, and it is the reason a
  # default run now produces more than one species.
  mate_compatibility_distance: 0.05
