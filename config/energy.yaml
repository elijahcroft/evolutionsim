# Every coefficient in the energy, mortality, and reproduction equations.
#
# This file is where the simulation is tuned. The rule the project follows: a trait may only
# be advantageous by earning energy, and may only be costly by spending energy or raising a
# mortality hazard. There are no direct stat bonuses anywhere, so this file plus genome.yaml
# fully determines what selection favours.
#
# Formulas are documented at the point of use in src/evosim/life/. Symbols below:
#   m = body mass = body_size^3      g = planet gravity      T = local temperature

energy_density: 1.0        # energy per unit mass, for predation gain and corpse deposition.

# ---- costs, per tick --------------------------------------------------------------------
costs:
  # basal = k_basal * m^0.75 * metabolic_rate * aerobic_scope * Q10(T) * upkeep_multipliers
  # The 0.75 exponent is Kleiber's law: metabolism scales sublinearly with mass, which is what
  # makes being large energetically efficient per unit mass and creates a real size incentive
  # to trade against the support and locomotion costs below.
  k_basal: 0.010
  basal_mass_exponent: 0.75
  basal_q10: 2.0                    # basal cost doubles per +10 C of body temperature.
  basal_reference_temp_c: 15.0

  # Upkeep of expensive tissue, added as multipliers on basal cost. These are what make
  # generalism, good digestion, longevity, and repair genuinely expensive.
  upkeep_temp_tolerance: 0.020      # per degree of tolerance half-width.
  upkeep_digestion: 0.900           # per unit of digestion_efficiency.
  upkeep_radiation_tolerance: 0.150
  upkeep_longevity: 0.300           # per unit of (1 - senescence_rate); anti-ageing costs.

  # support = k_support * m * g * (1 + armor) / body_slenderness
  # Linear in mass and in gravity: holding yourself up on a heavy planet is the dominant
  # penalty on large bodies, which is how "high gravity favours small" emerges rather than
  # being asserted.
  k_support: 0.006

  # locomotion = k_move * m * move_speed^2 * g^0.5 * medium_drag
  # Quadratic in speed (drag work), so speed is the single most expensive trait to push.
  k_move: 0.004
  move_gravity_exponent: 0.5
  drag_water: 1.6                   # denser medium: costlier to move through...
  drag_land: 1.0
  # ...but a dense atmosphere also supports the body, reducing effective support cost.
  # support is divided by (1 + pressure_buoyancy * pressure) on land.
  pressure_buoyancy: 0.05

  # sensory = k_sense * sense_range^1.5 * m^0.25
  # Superlinear in range: doubling detection radius more than doubles the neural investment.
  k_sense: 0.004
  sense_range_exponent: 1.5
  sense_mass_exponent: 0.25

  # thermoregulation = k_thermo * m^0.67 * max(0, |T - temp_optimum| - temp_tolerance)
  # Surface-area scaling (2/3), because heat is lost across a surface. Large bodies are
  # therefore thermally cheaper per unit mass -- Bergmann's rule, emergent.
  k_thermo: 0.0030
  thermo_mass_exponent: 0.6667

  # armor_upkeep = k_armor * armor * m^0.67
  # The 0.67 here is thermo_mass_exponent above, deliberately shared: both are areas over a
  # body's surface (heat loss, and the plating that covers it), so they should move together.
  # If a future model needs them to differ, armor gets its own exponent key -- it must not be
  # a literal in the code.
  k_armor: 0.0015

# ---- intake, per tick -------------------------------------------------------------------
intake:
  # autotrophy = k_photo * diet_autotroph * m^0.67 * light * sat(nutrients) * sat(moisture)
  #              * digestion_efficiency
  # Surface-area scaling: light and nutrients are collected across a surface, while basal cost
  # scales as m^0.75. Autotrophs therefore have a natural size ceiling -- though at the value
  # below the binding constraint on size is body support (linear in mass), which bites first.
  #
  # Calibrated in M3, the first milestone able to measure it. The M0 guess of 0.030 was an
  # order of magnitude too low: the four factors that erode it (light ~0.83, nutrient
  # saturation ~0.67, moisture saturation ~0.87, digestion 0.40) multiply out to ~0.19, so no
  # founder cell on the reference planet returned its own upkeep and the lineage always died.
  # At 0.30 about 90% of seeded ocean cells are net-positive for the founder genome and the
  # polar 10% are not, which is the intended shape: a habitable planet with unlivable edges.
  k_photo: 0.300
  photo_mass_exponent: 0.6667
  nutrient_half_saturation: 0.25     # Michaelis-Menten half-saturation constant.
  moisture_half_saturation: 0.15
  # Autotrophic uptake removes this much nutrient stock per unit energy gained.
  nutrient_draw_per_energy: 1.0

  # detritivory = k_detritus * diet_detritus * m^0.67 * sat(detritus) * digestion_efficiency
  k_detritus: 0.060
  detritus_mass_exponent: 0.6667
  detritus_half_saturation: 0.20

  # Predation / herbivory. Encounter rate per attacker per tick:
  #   rate = k_encounter * (0.5 + aggression) * (0.3 + move_speed) * (0.3 + sense_range)^2
  #          * prey_density
  k_encounter: 0.020
  # Capture probability is a logistic on the weighted contest below. Coefficients are the
  # relative importance of each factor; they are the arms-race dials.
  capture_bias: -1.20               # baseline difficulty: most attacks fail.
  capture_size_advantage: 1.10      # per log2 ratio of attacker to prey mass.
  capture_speed_advantage: 0.80
  capture_camouflage: 1.00          # prey camouflage, divided by (1 + attacker sense_range).
  capture_armor: 0.90
  capture_aggression: 0.35
  # A specialist gets little from the wrong food. diet_match is the dot product of the
  # attacker's herbivore/carnivore affinities with the prey's autotroph/heterotroph character.
  diet_match_floor: 0.05

  # Aerobic scope: intake and activity are capped at this multiple of basal cost, scaled by
  # oxygen availability. This is the mechanism by which a low-O2 planet limits body size and
  # activity level without any rule that says so.
  aerobic_scope_max: 8.0
  aerobic_scope_o2_exponent: 0.75

# ---- mortality hazards, per tick --------------------------------------------------------
# Each is an independent probability; they combine as 1 - prod(1 - h_i).
mortality:
  background: 0.0002
  # thermal = h_thermal_max * sigmoid over the tolerance-exceeded amount, so a brief excursion
  # is survivable and a sustained one is not.
  h_thermal_max: 0.30
  thermal_lethal_margin_c: 15.0     # degrees beyond tolerance at which hazard is ~half of max.
  h_radiation_max: 0.30
  radiation_scale: 1.0              # divided by (1 + radiation_tolerance).
  h_toxicity_max: 0.40
  toxicity_scale: 1.0
  h_pressure_max: 0.25
  pressure_mismatch_scale: 1.0      # |pressure - 1| / (1 + pressure_tolerance).
  # senescence = senescence_rate * (age / maturity_age)^exponent, clipped to 1.
  senescence_exponent: 3.0
  # Starvation is not probabilistic: energy <= 0 is death.

# ---- reproduction ----------------------------------------------------------------------
reproduction:
  # Cost per offspring = parental_investment * offspring_storage_capacity, and that energy
  # becomes the offspring's starting energy. Nothing is created or destroyed, so the r/K
  # tradeoff is enforced by arithmetic rather than by a rule.
  overhead: 1.15                    # >1: reproduction is lossy (gametes, failed births).
  # Offspring are placed in the parent's cell, displaced by up to this many cells.
  dispersal_radius: 1.0
  # Sexual reproduction: a mate must be in the same cell with standardised genetic distance
  # below this threshold. This is what makes assortative mating reinforce speciation.
  mate_search_radius: 0.0           # cells; 0 = same cell only.
  mate_compatibility_distance: 0.15
